  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <div class="logo">
          <i class="fa-solid fa-wallet"></i>
          <span>Rupee<strong>Track</strong></span>
        </div>
        <p class="brand-tagline">Manage your student finances with ease</p>
      </div>

      <!-- Auth Switch Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" id="tab-login-btn">Log In</button>
        <button class="tab-btn" id="tab-signup-btn">Sign Up</button>
      </div>

      <!-- Error / Alert Banner -->
      <div id="auth-alert" class="alert-box" style="display: none;"></div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form active">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="login-email" placeholder="you@college.edu" required />
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-password" placeholder="••••••••" required />
          </div>
        </div>

        <button type="submit" class="btn-auth" id="btn-submit-login">
          <span>Sign In</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
